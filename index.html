<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Design Agency - AI Product Design & Digital Services</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- Design Monks Styles -->
    <link href="https://cdn.prod.website-files.com/672a72b52eb5f37692d645a9/css/design-monks.shared.a6355be29.min.css" rel="stylesheet" type="text/css" crossorigin="anonymous"/>
    <link href="https://cdn.prod.website-files.com/672a72b52eb5f37692d645a9/css/design-monks.67b427216535397fbd9f5133-aae37237a.min.css" rel="stylesheet" type="text/css" crossorigin="anonymous"/>
    
    <!-- Splide Carousel CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css"/>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin="anonymous"/>
    
    <!-- WebFont Loader -->
    <script src="https://ajax.googleapis.com/ajax/libs/webfont/1.6.26/webfont.js"></script>
    <script>
      WebFont.load({
        google: {
          families: ["PT Sans:400,400italic,700,700italic", "Outfit:300,400,500,600,700", "Playfair Display:300,400,500,600,700", "Red Hat Display:300,400,500,600,700"]
        }
      });
    </script>
    
    <!-- Tailwind CSS -->
    <link href="tailwind.css" rel="stylesheet" />
    
    <style>
      body {
        margin: 0;
      }

      .idea-section {
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/index.tsx"></script>
    
    <!-- Splide Carousel JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide-extension-auto-scroll@0.5.3/dist/js/splide-extension-auto-scroll.min.js"></script>
    <script>
      // Initialize Splide carousels when they appear
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          document.querySelectorAll(".common-marquee-slider").forEach((item) => {
            if (item.splide) return; // Already initialized
            
            const autoScrollSpeed = item.dataset.speed ? parseFloat(item.dataset.speed) : 0.5;
            const isDraggable = item.dataset.drag !== "false";

            const splideInstance = new Splide(item, {
              pagination: false,
              arrows: false,
              autoWidth: true,
              type: "loop",
              drag: isDraggable,
              autoScroll: {
                speed: item.dataset.direction === "reversed" ? -autoScrollSpeed : autoScrollSpeed,
                pauseOnHover: false,
                pauseOnFocus: false
              }
            });

            splideInstance.mount(window.splide.Extensions);
            item.splide = splideInstance;

            if (window.Webflow && Webflow.require) {
              splideInstance.on("moved", () => Webflow.require("ix2").init());
              setTimeout(() => Webflow.require("ix2").init(), 500);
            }
          });
        }, 1000);
      });
    </script>
  </body>
</html>
